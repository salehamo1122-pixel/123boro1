services:
  - type: web
    name: telegram-selfbot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: TZ
        value: Asia/Tehran
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_USER_ID
        sync: false
      - key: SESSION_STRING
        sync: false
      - key: HELPER_USERNAME
        value: Tysydhebot
      - key: SUPPORT_USERNAME
        value: Saleh681
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: WEBAPP_URL
        value: https://salselfmmk.onrender.com/miniapp
      - key: PROFILE_WATCH_ENABLED
        value: "false"
